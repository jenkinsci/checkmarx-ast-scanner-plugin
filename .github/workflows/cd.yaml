# Note: additional setup is required, see https://www.jenkins.io/redirect/continuous-delivery-of-plugins
#
# Please find additional hints for individual trigger use case
# configuration options inline this script below.
#
---
name: cd
on:
  workflow_dispatch:
    inputs:
      validate_only:
        required: false
        type: boolean
        description: |
          Run validation with release drafter only
          → Skip the release job
        # Note: Change this default to true,
        #       if the checkbox should be checked by default.
        default: false
  # If you don't want any automatic trigger in general, then
  # the following check_run trigger lines should all be commented.
  # Note: Consider the use case #2 config for 'validate_only' below
  #       as an alternative option!

permissions:
  checks: read
  contents: write

jobs:
  maven-cd:
    uses: jenkins-infra/github-reusable-workflows/.github/workflows/maven-cd.yml@c2470861b1ad94810dc0d207b011e0b57bb91bbb # v1
    with:
      # Comment / uncomment the validate_only config appropriate to your preference:
      #
      # Use case #1 (automatic release):
      #   - Let any successful Jenkins build trigger another release,
      #     if there are merged pull requests of interest
      #   - Perform a validation only run with drafting a release note,
      #     if manually triggered AND inputs.validate_only has been checked.
      #
      validate_only: ${{ inputs.validate_only == true }}
      #
      # Alternative use case #2 (no automatic release):
      #   - Same as use case #1 - but:
      #     - Let any check_run trigger a validate_only run.
      #       => enforce the release job to be skipped.
      #
      #validate_only: ${{ inputs.validate_only == true || github.event_name == 'check_run' }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}

  # Custom step (not part of the jenkinsci CD template): jenkins-maven-cd-action only
  # deploys the artifact to repo.jenkins-ci.org and publishes the GitHub release text,
  # it does not attach the built .hpi as a downloadable release asset. This job restores
  # that behavior, previously done in the now-removed publish-plugin.yml.
  attach-release-assets:
    name: Attach hpi asset to release
    needs: maven-cd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # maven-cd only tags a commit when a release actually happens (not on a
      # validate_only run, or when no interesting PRs were merged), so this
      # step also acts as the gate for every step below it.
      - name: Determine if a release tag was created
        id: get_new_tag
        run: |
          git fetch --tags --force
          TAG_NAME=$(git tag --points-at HEAD | sort -V | tail -n 1)
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG_NAME" ]; then
            echo "No release tag found on HEAD, skipping asset upload."
          else
            echo "Found release tag: $TAG_NAME"
          fi

      - name: Set up JDK 11
        if: steps.get_new_tag.outputs.TAG_NAME != ''
        uses: actions/setup-java@2dfa2011c5b2a0f1489bf9e433881c92c1631f88 # v4.3.0
        with:
          distribution: temurin
          java-version: 11

      - name: Ensure Maven Dependencies are Downloaded
        if: steps.get_new_tag.outputs.TAG_NAME != ''
        run: mvn dependency:resolve

      - name: Build plugin package
        if: steps.get_new_tag.outputs.TAG_NAME != ''
        run: mvn -B package -DskipTests -Dset.changelist

      - name: Extract CLI version
        if: steps.get_new_tag.outputs.TAG_NAME != ''
        run: |
          chmod +x .github/scripts/extract_cli_version.sh
          .github/scripts/extract_cli_version.sh cx-linux

      - name: Print Extracted CLI Version
        if: steps.get_new_tag.outputs.TAG_NAME != ''
        run: |
          echo "Extracted CLI Version: $CLI_VERSION"

      - name: Get GitHub Release Upload URL
        if: steps.get_new_tag.outputs.TAG_NAME != ''
        id: get-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_new_tag.outputs.TAG_NAME }}
        run: |
          UPLOAD_URL=$(gh api /repos/${{ github.repository }}/releases/tags/$TAG_NAME --jq '.upload_url')
          if [[ -z "$UPLOAD_URL" ]]; then
            echo "ERROR: Failed to retrieve upload URL"
            exit 1
          fi
          echo "UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"

      - name: Upload Release Asset
        if: steps.get_new_tag.outputs.TAG_NAME != ''
        uses: shogo82148/actions-upload-release-asset@8f032eff0255912cc9c8455797fd6d72f25c7ab7 #v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: ./target/checkmarx-ast-scanner.hpi
          asset_name: checkmarx-ast-scanner.hpi
          asset_content_type: application/multipart-core
          overwrite: true
