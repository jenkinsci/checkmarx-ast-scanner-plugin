name: Notify Teams and JIRA On New Release

on:
  workflow_call:
    inputs:
      product_name:
        required: true
        type: string
      release_version:
        required: true
        type: string
      cli_release_version:
        required: true
        type: string
      release_author:
        required: true
        type: string
      release_url:
        required: true
        type: string
      jira_product_name:
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}

permissions: {}

jobs:
  notify-teams:
    name: Send Release Notifications
    runs-on: ubuntu-latest
    permissions:
      # No special permissions needed for this workflow
      contents: read

    steps:
      - name: Fetch Release Notes
        id: fetch_release_notes
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        env:
          RELEASE_URL: ${{ inputs.release_url }}
        with:
          script: |
            const releaseUrl = process.env.RELEASE_URL;
            const urlPattern = /https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/releases\/tag\/(.+)/;
            const match = releaseUrl.match(urlPattern);
            if (!match) {
              throw new Error('Invalid release URL format.');
            }
            const [_, owner, repo, tag] = match;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag
            });
            core.setOutput('release_notes', release.body);

      - name: Sanitize Release Notes
        id: sanitize_release_notes
        env:
          RELEASE_NOTES: ${{ steps.fetch_release_notes.outputs.release_notes }}
        run: |
          sanitized=$(echo "$RELEASE_NOTES" | sed '1{/^<!--/d}')
          sanitized=$(echo "$sanitized" | jq -Rs '.')
          echo $sanitized
          echo "sanitized_release_notes=$sanitized" >> $GITHUB_OUTPUT

      - name: Extract Contributors
        id: extract_contributors
        env:
          RELEASE_NOTES: ${{ steps.fetch_release_notes.outputs.release_notes }}
        run: |

          contributors=$(echo "$RELEASE_NOTES" | grep -o '@[a-zA-Z0-9_-]\+' | sort -u)
          
          echo "Contributors: $contributors"
          
          # Format contributors as a comma-separated list
          formatted_contributors=$(echo "$contributors" | tr '\n' ', ' | sed 's/, $//')
          formatted_contributors=$(echo "$contributors" | paste -sd ' , ' -)
          echo "Formatted Contributors: $formatted_contributors"
          
          # Initialize an empty string to hold formatted contributors
          formatted_contributors_links=""
      
          # Iterate over each contributor and format as a Markdown link
          for contributor in $contributors; do
            username=${contributor#@}
            formatted_contributors_links+="[${username}](https://github.com/${username}), "
          done
          
          echo "Formatted Contributors Links: $formatted_contributors_links"
          
          escaped_contributors_links=$(jq -Rsa . <<< "$formatted_contributors_links")
          echo "Escaped Contributors Links: $escaped_contributors_links"

          echo "formatted_contributors=$formatted_contributors" >> $GITHUB_OUTPUT
          echo "escaped_contributors_links=escaped_contributors_links" >> $GITHUB_OUTPUT
              
      - name: Extract Jira Ticket IDs
        id: extract_jira_tickets
        env:
          RELEASE_NOTES: ${{ steps.fetch_release_notes.outputs.release_notes }}
        run: |
          # Extract all AST-XXX patterns
          jira_tickets=$(echo "$RELEASE_NOTES" | grep -oE 'AST-[0-9]+' | sort -u)
          
          echo "Filtered Jira Tickets:"
          
          valid_tickets=()
          for ticket in $jira_tickets; do
            if ! [[ $ticket =~ ^AST-0{3,}$ ]]; then
              echo "$ticket"
              valid_tickets+=("\"$ticket\"")
            fi
          done
          
          # Format Jira tickets as a JSON array
          formatted_jira_tickets=$(IFS=,; echo "[${valid_tickets[*]}]")
          
          echo "Formatted Jira Tickets: $formatted_jira_tickets"
          
          echo "formatted_jira_tickets=$formatted_jira_tickets" >> $GITHUB_OUTPUT
      

      - name: Send notification to Teams
        uses: Skitionek/notify-microsoft-teams@9c67757f64d610fb6748d8ff3c11f284355ed7ec # v1.0.8
        env:
          WEBHOOK_URL: ${{ secrets.MS_TEAMS_WEBHOOK_URL }}
          PRODUCT_NAME: ${{ inputs.product_name }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CLI_RELEASE_VERSION: ${{ inputs.cli_release_version }}
          RELEASE_URL: ${{ inputs.release_url }}
          CONTRIBUTORS: ${{ steps.extract_contributors.outputs.formatted_contributors }}
          SANITIZED_NOTES: ${{ steps.sanitize_release_notes.outputs.sanitized_release_notes }}
        with:
          webhook_url: ${{ env.WEBHOOK_URL }}
          raw: >
            {
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "msteams": {
                      "width": "Full"
                    },
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": "New Release: **${PRODUCT_NAME} - ${RELEASE_VERSION}**",
                        "weight": "Bolder",
                        "size": "Medium"
                      },
                      {
                        "type": "FactSet",
                        "facts": [
                          { "title": "Product:", "value": "${PRODUCT_NAME}" },
                          { "title": "Version:", "value": "${RELEASE_VERSION}" },
                          { "title": "CLI Version:", "value": "${CLI_RELEASE_VERSION}" },
                          { "title": "Contributors:", "value": "${CONTRIBUTORS}" }
                        ]
                      },
                      {
                        "type": "TextBlock",
                        "text": ${SANITIZED_NOTES},
                        "wrap": true
                      }
                    ],
                    "actions": [
                      {
                        "type": "Action.OpenUrl",
                        "title": "View Release",
                        "url": "${RELEASE_URL}"
                      }
                    ]
                  }
                }
              ]
            }


      - name: Get Current Date
        id: current-date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Generate Release Version
        id: generate_jira_release_version
        env:
          JIRA_PRODUCT_NAME: ${{ inputs.jira_product_name }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          jira_release_version="${JIRA_PRODUCT_NAME}_${RELEASE_VERSION}"
          echo "Generated Release Version: $jira_release_version"
          echo "jira_release_version=$jira_release_version" >> $GITHUB_OUTPUT

      - name: Create New JIRA Release
        uses: satak/webrequest-action@3697cc0c0ba0d501729b080ab5825c04bf96132e # master
        env:
          JIRA_RELEASE_WEBHOOK_URL: ${{ secrets.JIRA_RELEASE_WEBHOOK_URL }}
          JIRA_RELEASE_WEBHOOK_TOKEN: ${{ secrets.JIRA_RELEASE_WEBHOOK_TOKEN }}
          JIRA_RELEASE_VERSION: ${{ steps.generate_jira_release_version.outputs.jira_release_version }}
        with:
          url: ${{ env.JIRA_RELEASE_WEBHOOK_URL }}
          headers: '{"X-Automation-Webhook-Token": "${{ env.JIRA_RELEASE_WEBHOOK_TOKEN }}"}'
          method: POST
          payload: |
            {
              "data": {
                "version": "${{ env.JIRA_RELEASE_VERSION }}",
                "startDate": "${{ env.date }}",
                "date": "${{ env.date }}"
              }
            }

      - name: Send Jira Tickets to Webhook
        uses: satak/webrequest-action@3697cc0c0ba0d501729b080ab5825c04bf96132e # master
        env:
          JIRA_TICKETS_WEBHOOK_URL: ${{ secrets.JIRA_TICKETS_WEBHOOK_URL }}
          JIRA_AUTOMATION_WEBHOOK_TOKEN: ${{ secrets.JIRA_AUTOMATION_WEBHOOK_TOKEN }}
          FORMATTED_JIRA_TICKETS: ${{ steps.extract_jira_tickets.outputs.formatted_jira_tickets }}
          JIRA_RELEASE_VERSION: ${{ steps.generate_jira_release_version.outputs.jira_release_version }}
        with:
          url: ${{ env.JIRA_TICKETS_WEBHOOK_URL }}
          headers: '{"X-Automation-Webhook-Token": "${{ env.JIRA_AUTOMATION_WEBHOOK_TOKEN }}"}'
          method: POST
          payload: |
            {
              "issues": ${{ env.FORMATTED_JIRA_TICKETS }},
              "data": {
                "releaseVersion": "${{ env.JIRA_RELEASE_VERSION }}"
              }
            }