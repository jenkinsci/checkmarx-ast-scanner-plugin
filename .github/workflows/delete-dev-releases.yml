name: Delete dev releases

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to delete'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to delete'
        required: true

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:

      - name: Delete releases and tags
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          pattern="-${TAG}.0"
          echo "Deleting releases and tags matching pattern: ${pattern}"

          # Delete releases whose tag contains the pattern (also removes the tag via --cleanup-tag)
          gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -F -- "$pattern" \
            | while read -r tag; do
                echo "Deleting release for tag: $tag"
                gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes || true
              done

          # Delete any remaining matching tags that had no associated release
          git ls-remote --tags origin \
            | sed 's#.*refs/tags/##; s#\^{}##' \
            | sort -u \
            | grep -F -- "$pattern" \
            | while read -r tag; do
                echo "Deleting remaining tag: $tag"
                git push origin --delete "$tag" || true
              done