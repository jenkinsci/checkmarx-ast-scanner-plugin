# Note: additional setup is required, see https://www.jenkins.io/redirect/continuous-delivery-of-plugins

name: Create Pre Release Or Nightly Version
on:
  workflow_call:
    inputs:
      tag:
        description: 'Jenkins tag name'
        required: false
        type: string
        default: nightly
  workflow_dispatch:
    inputs:
      tag:
        description: 'Jenkins tag name'
        required: false
        type: string
        default: nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  delete:
    uses: jenkinsci/checkmarx-ast-scanner-plugin/.github/workflows/delete-dev-releases.yml@76e89de8a0535b85b1fb6350663a67204877d56b
    permissions:
      contents: write  # for deleting releases
      id-token: write  # for GitHub token
      packages: write  # for package operations
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit  # zizmor: ignore[secrets-inherit]

  validate:
    name: Validate CI Status
    runs-on: ubuntu-latest
    permissions:
      contents: read  # for checking CI status
    outputs:
      should_release: ${{ steps.verify-ci-status.outputs.result == 'success' }}
    steps:
      - name: Verify CI status
        uses: jenkins-infra/verify-ci-status-action@7d194d0c5785a12623f350581db5243063542f90 #v1.2.2
        id: verify-ci-status
        if: inputs.tag == 'nightly'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          output_result: true

  release:
    name: Create Pre-Release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write  # for creating releases
      id-token: write  # for Maven publishing
    if: ${{ inputs.tag != 'nightly' || needs.validate.outputs.should_release == 'true' }}
    steps:
      - name: Check out
        uses: actions/checkout@9bb56186c3b09b4f86b1d471b76edbe601d3fb67 # v4.1.6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@2dfa2011c5b2a0f1489bf9e433881c92c1631f88 # v4.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: mvn compile and package
        run: |
          mvn package -DskipTests -Dset.changelist

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" target/checkmarx-ast-scanner.hpi \
            --title "$TAG" \
            --target "$COMMIT_SHA" \
            --generate-notes \
            --prerelease
