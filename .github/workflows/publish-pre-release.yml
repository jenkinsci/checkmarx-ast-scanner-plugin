# Note: additional setup is required, see https://www.jenkins.io/redirect/continuous-delivery-of-plugins

name: Create Pre Release Or Nightly Version
on:
  workflow_call:
    inputs:
      tag:
        description: 'Jenkins tag name'
        required: false
        type: string
        default: nightly
  workflow_dispatch:
    inputs:
      tag:
        description: 'Jenkins tag name'
        required: false
        type: string
        default: nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}

permissions: {}

jobs:
  delete:
    name: Delete old pre-releases
    uses: jenkinsci/checkmarx-ast-scanner-plugin/.github/workflows/delete-dev-releases.yml@876ac69ae39d4507947870ef1b2d0dca397757e1
    with:
      tag: ${{ inputs.tag }}

  validate:
    name: Validate Release Requirements
    runs-on: ubuntu-latest
    permissions:
      # Required to check CI status
      contents: read
    outputs:
      should_release: ${{ steps.verify-ci-status.outputs.result == 'success' }}
    steps:
      - name: Verify CI status
        uses: jenkins-infra/verify-ci-status-action@7d194d0c5785a12623f350581db5243063542f90 #v1.2.2
        id: verify-ci-status
        if: inputs.tag == 'nightly'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          output_result: true

  release:
    name: Create Pre-release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write # Required to create releases
    if: ${{ inputs.tag != 'nightly' || needs.validate.outputs.should_release == 'true' }}
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 11
        uses: actions/setup-java@2dfa2011c5b2a0f1489bf9e433881c92c1631f88 # v4.3.0
        with:
          distribution: temurin
          java-version: 11
     
      - name: mvn compile and package
        run: |
          mvn package -DskipTests -Dset.changelist
      
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" target/checkmarx-ast-scanner.hpi \
            --title "$TAG" \
            --generate-notes \
            --prerelease
