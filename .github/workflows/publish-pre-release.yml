# Note: additional setup is required, see https://www.jenkins.io/redirect/continuous-delivery-of-plugins

name: Create Pre Release Or Nightly Version
on:
  workflow_call:
    inputs:
      tag:
        description: 'Jenkins tag name'
        required: false
        type: string
        default: nightly
  workflow_dispatch:
    inputs:
      tag:
        description: 'Jenkins tag name'
        required: false
        type: string
        default: nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  delete:
    permissions:
      contents: write  # ceiling for delete-dev-releases.yml to delete tags/releases
    uses: jenkinsci/checkmarx-ast-scanner-plugin/.github/workflows/delete-dev-releases.yml@main # zizmor: ignore[unpinned-uses]
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # validate:
  #   runs-on: ubuntu-latest
  #   outputs:
  #     should_release: ${{ steps.verify-ci-status.outputs.result == 'success' }}
  #   steps:
  #     - name: Verify CI status
  #       uses: jenkins-infra/verify-ci-status-action@7d194d0c5785a12623f350581db5243063542f90 #v1.2.2
  #       id: verify-ci-status
  #       if: inputs.tag == 'nightly'
  #       with:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         output_result: true

  release:
    name: Release Pre-Release
    runs-on:  ubuntu-latest
    # needs: validate
    # if: ${{ inputs.tag != 'nightly' || needs.validate.outputs.should_release == 'true' }}
    permissions:
      contents: write  # for gh release create to publish the release and upload the plugin .hpi asset
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@2dfa2011c5b2a0f1489bf9e433881c92c1631f88
        with:
          distribution: temurin
          java-version: 17

      - name: mvn compile and package
        run: |
          mvn package -DskipTests -Dset.changelist

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" target/checkmarx-ast-scanner.hpi \
            --title "$TAG" \
            --target "$COMMIT_SHA" \
            --generate-notes \
            --prerelease
